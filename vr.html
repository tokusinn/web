<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="0 0 -4" rotation="0 30 0" color="#8EB7FF"></a-box>
      <a-box position="0 2.5 -4" rotation="0 35 0" color="#8EB7FF"></a-box>
      <a-sphere position="0 1.25 -5" radius="2" color="#FF90AB"></a-sphere>
      <a-sphere position="0 1.25 -1" radius="0,1" color="#FF44C3"></a-sphere>
      <a-cylinder position="1 1 -3" radius="0.5" height="1" rotation="90 5 0" color="#B4E2A3"></a-cylinder>
      <a-plane position="0 -1 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#79D0FF"></a-sky>
    </a-scene>
